<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">A gopher eating popcorn while watching a movie</title>
  <defs>
    <clipPath id="frame">
      <rect width="240" height="240" rx="40"/>
    </clipPath>
    <clipPath id="bucket">
      <path d="M80 192 H160 L151 240 H89 Z"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="20%" r="75%">
      <stop offset="0" stop-color="#fff6d5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff6d5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- theater -->
    <rect width="240" height="240" fill="#14172b"/>
    <rect width="240" height="240" fill="url(#glow)"/>

    <!-- screen -->
    <rect x="36" y="20" width="168" height="58" rx="6" fill="#fff6d5"/>
    <rect x="36" y="20" width="168" height="58" rx="6" fill="none" stroke="#2b3054" stroke-width="4"/>
    <path d="M112 36 L134 49 L112 62 Z" fill="#e63946"/>

    <!-- ears -->
    <circle cx="64" cy="110" r="15" fill="#6ad7e5" stroke="#14172b" stroke-width="3"/>
    <circle cx="64" cy="110" r="7" fill="#4aaebd"/>
    <circle cx="176" cy="110" r="15" fill="#6ad7e5" stroke="#14172b" stroke-width="3"/>
    <circle cx="176" cy="110" r="7" fill="#4aaebd"/>

    <!-- body -->
    <rect x="54" y="94" width="132" height="190" rx="66" fill="#6ad7e5" stroke="#14172b" stroke-width="3"/>

    <!-- eyes, looking up at the screen -->
    <circle cx="96" cy="132" r="22" fill="#fff" stroke="#14172b" stroke-width="3"/>
    <circle cx="144" cy="132" r="22" fill="#fff" stroke="#14172b" stroke-width="3"/>
    <circle cx="100" cy="121" r="10" fill="#14172b"/>
    <circle cx="148" cy="121" r="10" fill="#14172b"/>
    <circle cx="104" cy="117" r="3.5" fill="#fff"/>
    <circle cx="152" cy="117" r="3.5" fill="#fff"/>

    <!-- snout -->
    <ellipse cx="120" cy="163" rx="19" ry="13" fill="#f6d2a2" stroke="#14172b" stroke-width="3"/>
    <ellipse cx="120" cy="155" rx="9" ry="5.5" fill="#3b2a20"/>
    <path d="M112 175 h16 v9 a2 2 0 0 1 -2 2 h-12 a2 2 0 0 1 -2 -2 Z" fill="#fff" stroke="#14172b" stroke-width="2.5"/>
    <path d="M120 175 v11" stroke="#14172b" stroke-width="2"/>

    <g transform="translate(0 14)">
    <!-- popcorn -->
    <g fill="#fff3c4" stroke="#14172b" stroke-width="2.5">
      <circle cx="92" cy="190" r="9"/>
      <circle cx="148" cy="190" r="9"/>
      <circle cx="106" cy="184" r="10"/>
      <circle cx="134" cy="184" r="10"/>
      <circle cx="120" cy="180" r="11"/>
    </g>
    <circle cx="117" cy="177" r="3" fill="#ffd166"/>
    <circle cx="137" cy="182" r="2.5" fill="#ffd166"/>

    <!-- bucket -->
    <g clip-path="url(#bucket)">
      <rect x="70" y="190" width="100" height="60" fill="#fff"/>
      <rect x="86" y="190" width="12" height="60" fill="#e63946"/>
      <rect x="108" y="190" width="12" height="60" fill="#e63946"/>
      <rect x="130" y="190" width="12" height="60" fill="#e63946"/>
      <rect x="152" y="190" width="12" height="60" fill="#e63946"/>
    </g>
    <path d="M80 192 H160 L151 240 H89 Z" fill="none" stroke="#14172b" stroke-width="3"/>
    <rect x="76" y="190" width="88" height="9" rx="3" fill="#fff" stroke="#14172b" stroke-width="3"/>

    <!-- paws -->
    <ellipse cx="80" cy="212" rx="10" ry="8" fill="#f6d2a2" stroke="#14172b" stroke-width="3"/>
    <ellipse cx="160" cy="212" rx="10" ry="8" fill="#f6d2a2" stroke="#14172b" stroke-width="3"/>
  </g>
  </g>
</svg>
