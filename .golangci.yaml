---
version: "2"

linters:
  default: all
  disable:
    # checks the struct tag name case. We cannot change this due to tmdb API.
    - "tagliatelle"
    - "wsl"  # disable enforcement of whitespace
    - "wsl_v5"  # disable enforcement of whitespace
    - "nlreturn"  # removes requirement of whitespace before return
    - "paralleltest"  # unwanted
    - "exhaustruct"  # unwanted
    - "exhaustruct_v5"  # unwanted
    - "noinlineerr"  # inline error handling is the preferred style here
    - "depguard"  # no dependency allow-list for this project
    - "gomodguard"  # deprecated, replaced by gomodguard_v2
    - "varnamelen"  # unwanted
  exclusions:
    presets:
      - "std-error-handling"
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - lll
          - funlen

formatters:
  enable:
    - gofumpt
    - goimports
